import me.modmuss50.mpp.ReleaseType

plugins {
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
    id 'idea'
}

version = project.mod_version + "+" + project.minecraft_version
supported_version = project.supported_version
group = project.maven_group

processResources {
    inputs.properties("supported_version": supported_version, "version": project.version)

    filesMatching("fabric.mod.json") {
        expand "supported_version": supported_version, "version": project.version
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

sourceSets {
    nebulo {
        //compileClasspath += main.compileClasspath
        //runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.compileClasspath
        compileClasspath += main.output
        runtimeClasspath += main.runtimeClasspath
        runtimeClasspath += main.output
    }
}

loom {
    runs {
        nebuloClient {
            server()
            ideConfigGenerated project.rootProject == project
            name = "Nebulo Server"
            source sourceSets.main
        }
        nebuloServer {
            client()
            ideConfigGenerated project.rootProject == project
            name = "Nebulo Client"
            source sourceSets.main
        }
    }
}

configurations {
    nebuloRuntimeClasspath {
        extendsFrom runtimeClasspath
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    archivesBaseName = project.archives_base_name
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    repositories {
        maven {
            name = "transFishMaven"
            url = "https://maven.trans.fish/releases"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = archivesBaseName
            version = version

            from components.java
            publishMods {
                file = remapJar.archiveFile
                changelog = getRootProject().file("CHANGELOG.md").text

                ReleaseType releaseType;
                if (mod_version.toLowerCase().contains("beta")) {
                    releaseType = ReleaseType.BETA
                } else if (version.toLowerCase().contains("alpha")) {
                    releaseType = ReleaseType.ALPHA
                } else {
                    releaseType = ReleaseType.STABLE
                }
                type = releaseType
                modLoaders.add("fabric")

                def version_range = property("publish_version_range").toString().split("-")
                def from = version_range[0]
                def to = version_range[1]
                if (providers.gradleProperty('louisModrinthToken').present) {
                    modrinth {
                        projectId = "D4OgkVp4"
                        accessToken = property("louisModrinthToken")
                        minecraftVersionRange {
                            start = from
                            end = to
                        }
                        requires("fabric-api")
                    }
                }
                if (providers.gradleProperty('louisModrinthToken').present) {
                    curseforge {
                        projectId = "927916"
                        projectSlug = "nebula"
                        accessToken = property("louisCurseforgeToken")
                        minecraftVersionRange {
                            start = from
                            end = to
                        }
                        displayName = this.version
                        requires("fabric-api")
                    }
                }
                if (providers.gradleProperty('modPublishWebHook').present) {
                    discord {
                         webhookUrl = modPublishWebHook
                    }
                }
            }
        }
    }
}

